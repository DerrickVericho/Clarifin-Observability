global:
  scrape_interval: 15s

storage:
  tsdb:
    # Keep >= the Collector's retry max_elapsed_time (30m), or replayed samples are rejected.
    out_of_order_time_window: 30m

otlp:
  # Each entry becomes a label on every OTLP series: add only low-cardinality attributes.
  promote_resource_attributes:
    - service.version
    - deployment.environment.name
    - container.name

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: node
    static_configs:
      - targets: ["docker-host:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
