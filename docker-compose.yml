name: clarifin-observability

# Start the app stack first: it creates the external `clarifin` network.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    restart: unless-stopped
    # Root is needed for Docker's logs and socket. The socket is root-equivalent on the
    # host: never expose this container beyond localhost.
    user: "0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    ports:
      # Only needed when the backend runs on the host; containers use the network.
      - "127.0.0.1:4318:4318"

    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - otelcol-storage:/var/lib/otelcol/file_storage

    networks:
      - clarifin

    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:3.6.6
    restart: unless-stopped
    volumes:
      - loki-data:/loki

    networks:
      - clarifin

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - clarifin

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    # Local only: anyone who reaches port 3000 is admin without login. Remove before exposing.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      - clarifin

    depends_on:
      - loki
      - prometheus

volumes:
  otelcol-storage:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  clarifin:
    name: clarifin
    external: true
