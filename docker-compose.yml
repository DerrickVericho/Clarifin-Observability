name: clarifin-observability

# Start the app stack first: it creates the external `clarifin` network.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    restart: unless-stopped
    user: "0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    ports:
      - "127.0.0.1:4318:4318"

    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - otelcol-storage:/var/lib/otelcol/file_storage

    networks:
      - clarifin

    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:3.6.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]

    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

    networks:
      - clarifin

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    # Must match node-exporter's listen address.
    extra_hosts:
      - "docker-host:172.17.0.1"

    networks:
      - clarifin

  # Host network and PID namespace so it reports the host, not its own container.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      # docker0's address: reachable from containers, not from the public interface.
      # Change here and in prometheus' extra_hosts if the daemon's `bip` is changed.
      - --web.listen-address=172.17.0.1:9100

    volumes:
      # Option: on Linux use `ro,rslave` so mounts added later are seen; Docker Desktop rejects it.
      - /:/host:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Set to "true" once Grafana is served over HTTPS; over plain HTTP it breaks login.
      GF_SECURITY_COOKIE_SECURE: "false"

    secrets:
      - grafana_admin_password
      - grafana_secret_key

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      - clarifin

    depends_on:
      - loki
      - prometheus

# On Linux the files must be readable by Grafana's uid 472: chown 472 and chmod 400.
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  grafana_secret_key:
    file: ./secrets/grafana_secret_key

volumes:
  otelcol-storage:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  clarifin:
    name: clarifin
    external: true
