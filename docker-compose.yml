name: clarifin-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    restart: unless-stopped
    user: "0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:?}:4318"

    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - otelcol-storage:/var/lib/otelcol/file_storage

    networks:
      - clarifin

    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:3.6.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]

    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

    networks:
      - clarifin

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:?}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    extra_hosts:
      - "docker-host:${DOCKER_HOST_IP:?}"

    networks:
      - clarifin

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${DOCKER_HOST_IP:?}:9100

    volumes:
      - /:/host:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    command:
      - --collector.stat_checkpointer
      - --collector.long_running_transactions
      - --collection-timeout=10s

    environment:
      DATA_SOURCE_URI: ${POSTGRES_HOST:?}:${POSTGRES_PORT:?}/${POSTGRES_DB:?}?sslmode=${POSTGRES_SSLMODE:?}
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:?}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password

    secrets:
      - postgres_exporter_password

    networks:
      - clarifin

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:?}

    secrets:
      - grafana_admin_password
      - grafana_secret_key

    ports:
      - "127.0.0.1:${GRAFANA_PORT:?}:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      - clarifin

    depends_on:
      - loki
      - prometheus

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  grafana_secret_key:
    file: ./secrets/grafana_secret_key
  postgres_exporter_password:
    file: ./secrets/postgres_exporter_password

volumes:
  otelcol-storage:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  clarifin:
    name: clarifin
    external: true
