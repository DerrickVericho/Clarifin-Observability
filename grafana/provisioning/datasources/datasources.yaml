apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Must match the app's metric export interval, or short rate() windows return nothing.
      timeInterval: 60s

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
