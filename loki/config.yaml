auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

# Never edit an existing period: data written under it becomes unreadable.
# To move to object storage, append a period with a future `from` date and `object_store: s3`.
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Option: S3-compatible object storage, used only by a schema period that names it.
# storage_config:
#   aws:
#     s3: https://<access_key>:<secret_key>@<endpoint>/<bucket>
#     s3forcepathstyle: true

ingester:
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: false
    # Keep below the container memory limit once one is set.
    replay_memory_ceiling: 4GB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true # changed
  retention_delete_delay: 2h
  delete_request_store: filesystem # changed: required when retention is enabled

limits_config:
  # changed. Time-based only: disk use is roughly ingest per day × this period.
  retention_period: 720h

  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  max_line_size: 256KB
  max_global_streams_per_user: 5000
  max_label_names_per_series: 15

  reject_old_samples: true
  reject_old_samples_max_age: 1w

  # Required by the OTLP endpoint the Collector writes to.
  allow_structured_metadata: true

  max_query_length: 721h
  max_entries_limit_per_query: 5000

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false # changed
